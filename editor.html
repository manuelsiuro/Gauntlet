<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gauntlet 3D - Level & Texture Editor</title>
    <!-- Use shared stylesheet for base styles and fonts -->
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #05050a;
        color: #fff;
        font-family: 'Outfit', sans-serif;
        overflow-x: hidden;
      }
      
      /* Navigation Bar */
      .editor-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: rgba(10, 10, 20, 0.85);
        border-bottom: 2px solid rgba(147, 51, 234, 0.4);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .editor-nav h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 2px;
      }

      .nav-tabs {
        display: flex;
        gap: 15px;
      }

      .tab-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #aaa;
        padding: 10px 20px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tab-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .tab-btn.active {
        background: rgba(147, 51, 234, 0.25);
        border-color: rgb(147, 51, 234);
        color: #fff;
        box-shadow: 0 0 10px rgba(147, 51, 234, 0.4);
      }

      .btn-exit {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgb(239, 68, 68);
        color: #fca5a5;
        text-decoration: none;
        padding: 10px 20px;
        font-size: 13px;
        transition: all 0.3s ease;
      }

      .btn-exit:hover {
        background: rgba(239, 68, 68, 0.35);
        color: #fff;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
      }

      /* Layout Panels */
      .editor-workspace {
        display: none;
        padding: 25px;
        gap: 25px;
        max-width: 1500px;
        margin: 0 auto;
        min-height: calc(100vh - 120px);
        box-sizing: border-box;
      }

      .editor-workspace.active {
        display: flex;
      }

      /* Side panels & Card layouts */
      .panel-card {
        background: rgba(15, 15, 25, 0.65);
        border: 1px solid rgba(147, 51, 234, 0.25);
        border-radius: 12px;
        padding: 20px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .sidebar-panel {
        width: 320px;
        flex-shrink: 0;
      }

      .center-panel {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(5, 5, 10, 0.8);
        border-radius: 12px;
        border: 1px dashed rgba(147, 51, 234, 0.15);
        padding: 20px;
        overflow: auto;
      }

      .right-panel {
        width: 300px;
        flex-shrink: 0;
      }

      /* Panel Headings */
      .panel-title {
        margin-top: 0;
        margin-bottom: 5px;
        font-size: 16px;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(147, 51, 234, 0.15);
        padding-bottom: 8px;
        color: #d8b4fe;
      }

      /* Inputs and Labels */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {
        font-size: 12px;
        color: #a78bfa;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .form-group input, .form-group select {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(147, 51, 234, 0.3);
        border-radius: 6px;
        color: #fff;
        padding: 8px 12px;
        font-family: inherit;
        font-size: 13px;
        outline: none;
        transition: border-color 0.3s;
      }

      .form-group input:focus, .form-group select:focus {
        border-color: rgb(168, 85, 247);
        box-shadow: 0 0 8px rgba(168, 85, 247, 0.25);
      }

      .form-row {
        display: flex;
        gap: 10px;
      }

      /* Brush Palette Tab Filter */
      .brush-filter-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
        border-bottom: 1px solid rgba(147, 51, 234, 0.2);
        padding-bottom: 6px;
      }

      .filter-tab-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        color: #888;
        padding: 4px 6px;
        font-size: 9px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        transition: all 0.2s ease;
        flex-grow: 1;
        text-align: center;
      }

      .filter-tab-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }

      .filter-tab-btn.active {
        background: rgba(147, 51, 234, 0.2);
        border-color: rgb(147, 51, 234);
        color: #e9d5ff;
      }

      /* Level Editor Brush Palette */
      .brush-palette {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        max-height: 280px;
        overflow-y: auto;
        padding-right: 5px;
      }

      .brush-item {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 11px;
        text-align: left;
        transition: all 0.2s ease;
        color: #fff;
      }

      .brush-item:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .brush-item.active {
        background: rgba(147, 51, 234, 0.2);
        border-color: rgb(147, 51, 234);
        box-shadow: 0 0 8px rgba(147, 51, 234, 0.3);
      }

      .brush-color {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        flex-shrink: 0;
      }

      /* Level Grid Canvas Workspace */
      .grid-container {
        display: grid;
        gap: 1px;
        background: rgba(147, 51, 234, 0.15);
        border: 2px solid rgba(147, 51, 234, 0.4);
        padding: 3px;
        border-radius: 8px;
        user-select: none;
      }

      .grid-cell {
        width: 26px;
        height: 26px;
        background: #0f0f1c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.4);
        cursor: crosshair;
        transition: background-color 0.1s ease;
        position: relative;
      }

      .grid-cell:hover {
        filter: brightness(1.4);
        outline: 1px solid rgba(255, 255, 255, 0.5);
        z-index: 1;
      }

      /* Texture Editor Grid Workspace */
      .pixel-grid {
        display: grid;
        gap: 1px;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 4px;
        border-radius: 8px;
        user-select: none;
      }

      .pixel-cell {
        width: 20px;
        height: 20px;
        background: rgba(0, 0, 0, 0.4);
        cursor: crosshair;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .pixel-cell:hover {
        outline: 1px solid #fff;
        z-index: 2;
      }

      /* Palette Color Inputs */
      .palette-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 250px;
        overflow-y: auto;
        padding-right: 5px;
      }

      .palette-row {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(147, 51, 234, 0.2);
        padding: 6px 10px;
        border-radius: 6px;
      }

      .char-indicator {
        font-family: monospace;
        font-weight: bold;
        width: 16px;
        font-size: 14px;
        text-align: center;
      }

      .color-picker-input {
        width: 32px;
        height: 24px;
        border: none;
        background: none;
        cursor: pointer;
        padding: 0;
      }

      .color-hex-val {
        flex-grow: 1;
        font-size: 12px;
        font-family: monospace;
      }

      /* Preview Canvas */
      .texture-preview-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(147, 51, 234, 0.2);
        border-radius: 8px;
        padding: 15px;
      }

      .preview-canvas {
        image-rendering: pixelated;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #000;
        width: 128px;
        height: 128px;
      }

      /* Footer Coordinate display */
      .coords-footer {
        display: flex;
        gap: 20px;
        font-size: 12px;
        color: #a78bfa;
        margin-top: 10px;
        font-weight: 500;
      }

      /* Buttons customization */
      .editor-btn {
        background: rgba(147, 51, 234, 0.2);
        border: 1px solid rgb(147, 51, 234);
        color: #fff;
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .editor-btn:hover {
        background: rgba(147, 51, 234, 0.4);
        box-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
      }

      .editor-btn.btn-sec {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.2);
        color: #ccc;
      }

      .editor-btn.btn-sec:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
      }

      .editor-btn.btn-play {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgb(34, 197, 94);
        color: #a7f3d0;
      }

      .editor-btn.btn-play:hover {
        background: rgba(34, 197, 94, 0.4);
        color: #fff;
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(147, 51, 234, 0.4);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(147, 51, 234, 0.7);
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="editor-nav">
      <h1 class="pixel-text neon-text-red">GAUNTLET 3D EDITOR</h1>
      <div class="nav-tabs">
        <button id="tab-level-editor" class="tab-btn pixel-text active">LEVEL EDITOR</button>
        <button id="tab-texture-editor" class="tab-btn pixel-text">TEXTURE EDITOR</button>
      </div>
      <a href="index.html" class="btn-exit pixel-text">EXIT TO GAME</a>
    </nav>

    <!-- LEVEL EDITOR WORKSPACE -->
    <section id="level-workspace" class="editor-workspace active">
      
      <!-- Left sidebar: Meta and brushes -->
      <div class="sidebar-panel panel-card">
        <h2 class="pixel-text panel-title">SETTINGS</h2>
        
        <!-- Metadata -->
        <div class="form-group">
          <label for="meta-level-name">Level Name</label>
          <input type="text" id="meta-level-name" value="Custom Dungeon" />
        </div>

        <div class="form-group" style="margin-bottom: 10px;">
          <label for="meta-theme">Dungeon Theme</label>
          <select id="meta-theme">
            <option value="classic">Classic Crypt (Blue)</option>
            <option value="lava">Lava Forge (Red)</option>
            <option value="ice">Ice Citadel (Cyan)</option>
            <option value="toxic">Toxic Gardens (Green)</option>
          </select>
        </div>
        
        <div class="form-row">
          <div class="form-group" style="width: 50%;">
            <label for="meta-level-num">Level No. (1-30)</label>
            <input type="number" id="meta-level-num" min="1" max="30" value="1" />
          </div>
          <div class="form-group" style="width: 50%;">
            <label for="meta-spawner-speed">Spawner Speed</label>
            <select id="meta-spawner-speed">
              <option value="1.0">Normal (1x)</option>
              <option value="1.5">Fast (1.5x)</option>
              <option value="2.0">Nightmare (2x)</option>
              <option value="0.7">Slow (0.7x)</option>
            </select>
          </div>
        </div>

        <h2 class="pixel-text panel-title" style="margin-top: 10px;">GRID SIZE</h2>
        <div class="form-row">
          <div class="form-group" style="width: 50%;">
            <label for="grid-cols">Width (Cols)</label>
            <input type="number" id="grid-cols" min="10" max="50" value="20" />
          </div>
          <div class="form-group" style="width: 50%;">
            <label for="grid-rows">Height (Rows)</label>
            <input type="number" id="grid-rows" min="10" max="50" value="20" />
          </div>
        </div>
        <button id="btn-resize-grid" class="editor-btn btn-sec" style="padding: 6px 12px; font-size: 11px;">RESIZE GRID</button>

        <h2 class="pixel-text panel-title" style="margin-top: 10px;">BRUSH PALETTE</h2>
        <div class="brush-filter-tabs">
          <button class="filter-tab-btn active" data-filter="all">ALL</button>
          <button class="filter-tab-btn" data-filter="dungeon">TILES</button>
          <button class="filter-tab-btn" data-filter="spawners">MOBS</button>
          <button class="filter-tab-btn" data-filter="items">ITEMS</button>
          <button class="filter-tab-btn" data-filter="decals">DECALS</button>
        </div>
        <div id="palette-brushes" class="brush-palette">
          <!-- Brushes dynamically loaded in editor.js -->
        </div>
      </div>

      <!-- Center grid view -->
      <div class="center-panel">
        <div id="level-grid-container" class="grid-container">
          <!-- Grid cells dynamically generated -->
        </div>
        <div class="coords-footer">
          <div>HOVER: <span id="hover-coords" class="text-yellow">X: 0, Y: 0</span></div>
          <div>ACTIVE TILE: <span id="active-tile-desc" class="text-green">Floor</span></div>
        </div>
      </div>

      <!-- Right panel: IO and playtesting -->
      <div class="right-panel panel-card">
        <h2 class="pixel-text panel-title">FILE CONTROLS</h2>
        
        <div class="form-group">
          <label for="base-map-select">Load Preset Map</label>
          <select id="base-map-select">
            <option value="">-- Choose Base Map --</option>
            <option value="1">Base Map 1 (Tutorial)</option>
            <option value="2">Base Map 2 (Maze)</option>
            <option value="3">Base Map 3 (Cross Gates)</option>
            <option value="4">Base Map 4 (Arena)</option>
            <option value="5">Base Map 5 (Spiral Labyrinth)</option>
            <option value="6">Base Map 6 (Treasury Rooms)</option>
          </select>
        </div>

        <button id="btn-load-preset" class="editor-btn btn-sec">LOAD PRESET</button>
        <button id="btn-generate-maze" class="editor-btn btn-sec" style="background: rgba(51, 204, 255, 0.15); border-color: rgb(51, 204, 255); color: #c0f0ff;">GENERATE RANDOM MAZE</button>
        <button id="btn-clear-map" class="editor-btn btn-sec">CLEAR MAP</button>

        <div style="border-top: 1px solid rgba(147, 51, 234, 0.15); margin: 5px 0;"></div>

        <button id="btn-export-json" class="editor-btn">EXPORT AS JSON</button>
        
        <div class="form-group">
          <label>Upload Map JSON</label>
          <input type="file" id="file-import-json" accept=".json" style="padding: 4px; font-size: 11px;" />
        </div>

        <button id="btn-copy-code" class="editor-btn btn-sec">COPY JS ARRAY CODE</button>

        <h2 class="pixel-text panel-title" style="margin-top: 15px;">PLAYTEST SANDBOX</h2>
        <div class="form-group">
          <label for="playtest-class">Select Hero</label>
          <select id="playtest-class">
            <option value="warrior">Warrior (Thor)</option>
            <option value="wizard">Wizard (Merlin)</option>
            <option value="valkyrie">Valkyrie (Thyra)</option>
            <option value="elf">Elf (Questor)</option>
          </select>
        </div>
        <button id="btn-playtest" class="editor-btn btn-play pixel-text">PLAYTEST LEVEL</button>
      </div>

    </section>

    <!-- TEXTURE EDITOR WORKSPACE -->
    <section id="texture-workspace" class="editor-workspace">
      
      <!-- Left sidebar: texture list and file actions -->
      <div class="sidebar-panel panel-card">
        <h2 class="pixel-text panel-title">SELECT ASSET</h2>
        
        <div class="form-group">
          <label for="texture-select">Choose Texture</label>
          <select id="texture-select">
            <!-- Populated dynamically -->
          </select>
        </div>

        <button id="btn-texture-new" class="editor-btn btn-sec">CREATE NEW TEXTURE</button>
        
        <div style="border-top: 1px solid rgba(147, 51, 234, 0.15); margin: 10px 0;"></div>
        
        <button id="btn-texture-save" class="editor-btn">SAVE TO GAME</button>
        <button id="btn-texture-reset" class="editor-btn btn-sec">RESET TO DEFAULT</button>

        <div style="border-top: 1px solid rgba(147, 51, 234, 0.15); margin: 10px 0;"></div>
        
        <button id="btn-texture-export-json" class="editor-btn btn-sec">SAVE AS JSON</button>
        
        <div class="form-group">
          <label>Load Texture JSON</label>
          <input type="file" id="file-texture-import-json" accept=".json" style="padding: 4px; font-size: 11px;" />
        </div>
        
        <button id="btn-texture-copy-code" class="editor-btn btn-sec">COPY GENERATOR CODE</button>
      </div>

      <!-- Center grid view -->
      <div class="center-panel">
        <div id="texture-grid-container" class="pixel-grid">
          <!-- Pixel grid generated dynamically -->
        </div>
        <div class="coords-footer">
          <div>ASSET: <span id="active-asset-name" class="text-yellow">-</span></div>
          <div>DIMENSIONS: <span id="active-asset-dims" class="text-green">16 x 16</span></div>
        </div>
      </div>

      <!-- Right panel: Palette and preview -->
      <div class="right-panel panel-card">
        <h2 class="pixel-text panel-title">COLOR PALETTE</h2>
        
        <div id="texture-palette-list" class="palette-list">
          <!-- Dynamically populated color rows -->
        </div>
        
        <button id="btn-palette-add-color" class="editor-btn btn-sec" style="padding: 6px; font-size: 11px;">+ ADD PALETTE COLOR</button>

        <h2 class="pixel-text panel-title" style="margin-top: 15px;">LIVE RENDER PREVIEW</h2>
        <div class="texture-preview-box">
          <canvas id="preview-canvas" class="preview-canvas" width="64" height="64"></canvas>
          <div style="font-size: 11px; color: #a78bfa;">Scale: 400% (Nearest Neighbor)</div>
        </div>
      </div>

    </section>

    <!-- Main Editor Script Entry -->
    <script type="module" src="/src/editor.js"></script>
  </body>
</html>
